<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#E7E5E4}a{color:#0D9488}a:hover{color:#0F766E}</style>
</helmet>
<section style="display:flex;gap:48px;padding:48px;align-items:flex-start;width:2400px">
<sc-for list="{{ frames }}" as="f" hint-placeholder-count="4">
<div id="{{ f.id }}" style="flex:none">
  <div style="display:flex;gap:12px;align-items:center;margin-bottom:8px"><span style="font-family:'JetBrains Mono',monospace;font-size:12px;padding:4px 8px;border-radius:6px;background:#CCFBF1;color:#1C1917">{{ f.id }}</span><span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#57534E">{{ f.name }}</span></div>
  <div style="{{ f.style }}">
    <div style="{{ f.col }}">
      <div style="height:60px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--color-surface);border-bottom:1px solid var(--color-border)">
        <div style="width:32px;height:32px;border-radius:8px;background:var(--color-accent-soft);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none">PH</div>
        <div style="flex:1;min-width:0;font-size:16px;line-height:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Paw House Spa &amp; Vet</div>
        <div style="height:44px;padding:0 14px;display:flex;align-items:center;border-radius:10px;background:var(--color-accent);color:#1C1917;font-size:14px;font-weight:600;flex:none">Đặt lịch</div>
        <sc-if value="{{ f.guest }}" hint-placeholder-val="{{ true }}"><div style="height:44px;padding:0 6px;display:flex;align-items:center;font-size:14px;font-weight:500;color:var(--color-primary);flex:none">Đăng nhập</div></sc-if>
        <sc-if value="{{ f.user }}" hint-placeholder-val="{{ false }}"><div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none"><div style="width:36px;height:36px;border-radius:9999px;background:var(--color-primary-soft);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">LH</div></div></sc-if>
      </div>

      <div style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column">
        <div style="padding:16px;display:flex;flex-direction:column;gap:16px">
          <div style="height:160px;border-radius:16px;border:1px dashed var(--color-border);background:repeating-linear-gradient(135deg,transparent 0 10px,var(--color-surface-muted) 10px 11px);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--color-text-muted)">ảnh bìa shop</div>
          <div style="height:300px;border-radius:10px;border:1px dashed var(--color-border);background:repeating-linear-gradient(135deg,transparent 0 10px,var(--color-surface-muted) 10px 11px);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--color-text-muted);text-align:center;padding:0 16px">vùng nội dung · một cột · chữ 16/24 · control 44px</div>
        </div>
        <div style="margin-top:auto;padding:24px 16px 16px;text-align:center;font-size:12px;line-height:16px;color:var(--color-text-muted)"><span style="color:var(--color-primary);text-decoration:underline">Điều khoản sử dụng</span> · Đặt lịch bởi PawBook</div>
      </div>

      <sc-if value="{{ f.cta }}" hint-placeholder-val="{{ true }}">
        <div style="flex:none;padding:12px 16px;background:var(--color-surface);border-top:1px solid var(--color-border)">
          <div style="height:44px;border-radius:10px;background:var(--color-accent);color:#1C1917;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600">Đặt lịch hẹn</div>
        </div>
      </sc-if>
      <div style="height:64px;flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--color-surface);border-top:1px solid var(--color-border);padding:4px 0 {{ f.safe }}px;box-sizing:border-box">
        <sc-for list="{{ f.nav }}" as="n" hint-placeholder-count="4">
          <div style="{{ n.style }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{ n.d }}"></path></svg><span>{{ n.label }}</span></div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</sc-for>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const L = {'--color-bg':'#FAFAF9','--color-surface':'#FFFFFF','--color-surface-muted':'#F5F5F4','--color-border':'#E7E5E4','--color-text':'#1C1917','--color-text-muted':'#57534E','--color-text-subtle':'#A8A29E','--color-primary':'#0D9488','--color-primary-soft':'#CCFBF1','--color-on-primary':'#FFFFFF','--color-accent':'#F97362','--color-accent-soft':'#FFE4DF','--shadow-lg':'0 12px 32px rgb(28 25 23 / .16)'};
    const D = {'--color-bg':'#0F1514','--color-surface':'#161E1D','--color-surface-muted':'#1D2826','--color-border':'#2A3735','--color-text':'#ECF1F0','--color-text-muted':'#9DB0AD','--color-text-subtle':'#6B7F7C','--color-primary':'#2DD4BF','--color-primary-soft':'#123A36','--color-on-primary':'#042F2E','--color-accent':'#FB8A7B','--color-accent-soft':'#3B201C','--shadow-lg':'0 0 0 1px #2A3735'};
    const P = { home:'M3 10.5 12 3l9 7.5V21H3z M9 21v-7h6v7', svc:'M2 7h20v14H2z M16 7V3H8v4', cal:'M8 2v4 M16 2v4 M3 10h18 M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z', user:'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z' };
    const nav = () => [['Trang chủ',P.home,1],['Dịch vụ',P.svc],['Lịch hẹn',P.cal],['Tài khoản',P.user]].map(m => ({ label:m[0], d:m[1], style:{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:2, minHeight:44, fontSize:12, lineHeight:'16px', fontWeight:m[2]?600:500, color:m[2]?'var(--color-primary)':'var(--color-text-muted)' } }));
    const base = { fontFamily:"'Be Vietnam Pro', sans-serif", fontSize:16, lineHeight:'24px', background:'var(--color-bg)', color:'var(--color-text)', boxSizing:'border-box', overflow:'hidden', position:'relative', border:'1px solid var(--color-border)' };
    const mob = (id, name, th, o) => ({ id, name, guest:!o.user, user:!!o.user, cta:!!o.cta, safe:o.safe||8, nav:nav(),
      style:Object.assign({}, th, base, { width:390, height:844, borderRadius:32 }),
      col:{ height:'100%', display:'flex', flexDirection:'column' } });
    const desk = { id:'2d', name:'K2 Khung Site / desktop (cột 480px giữa trang)', guest:true, user:false, cta:true, safe:8, nav:nav(),
      style:Object.assign({}, L, base, { width:1000, height:844, borderRadius:16, background:'var(--color-surface-muted)' }),
      col:{ height:'100%', width:480, margin:'0 auto', display:'flex', flexDirection:'column', background:'var(--color-bg)', borderLeft:'1px solid var(--color-border)', borderRight:'1px solid var(--color-border)', boxSizing:'border-box' } };
    return { frames:[
      mob('2a','K2 Khung Site / mobile 390 / khách chưa đăng nhập + CTA dính đáy',L,{cta:true}),
      mob('2b','K2 Khung Site / mobile 390 / đã đăng nhập (avatar)',L,{user:true}),
      mob('2c','K2 Khung Site / mobile 390 / dark',D,{cta:true}),
      desk
    ] };
  }
}
</script>
</body>
</html>
